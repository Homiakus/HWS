name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Resolve modules
        shell: bash
        run: |
          go mod tidy
          echo '--- HWS_GO_MOD_BEGIN ---'
          cat go.mod
          echo '--- HWS_GO_MOD_END ---'
          echo '--- HWS_GO_SUM_BEGIN ---'
          cat go.sum
          echo '--- HWS_GO_SUM_END ---'
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Unformatted Go files:"
            echo "$files"
            exit 1
          fi
      - name: Unit tests
        run: go test -timeout 60s ./...
      - name: Race tests
        run: go test -race -timeout 120s ./...
      - name: Vet
        run: go vet ./...
      - name: Demo smoke test
        run: go run ./cmd/hwsctl
