name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Module graph check
        shell: bash
        run: |
          go mod download github.com/godbus/dbus/v5@v5.1.0
          go mod tidy
          git diff --exit-code -- go.mod
      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "Unformatted Go files:"
            echo "$files"
            gofmt -d .
            exit 1
          fi
      - name: Unit tests
        run: go test -timeout 60s ./...
      - name: Race tests
        run: go test -race -timeout 120s ./...
      - name: Vet
        run: go vet ./...
      - name: D-Bus round trip
        run: dbus-run-session -- go test -timeout 30s -run TestSessionRoundTrip ./internal/dbusapi
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check providers/browser/webextension/background.js
          node --check providers/vscode/extension.js
          node --input-type=module --check < shell-extension/extension.js
          node --input-type=module --check < shell-extension/appCapsule.js
          node --input-type=module --check < shell-extension/daemonClient.js
          node --input-type=module --check < shell-extension/homeGrid.js
          node --input-type=module --check < shell-extension/homeGridModel.js
          node --input-type=module --check < shell-extension/workspaceStateModel.js
          node --input-type=module --check < shell-extension/shellActionModel.js
          node --input-type=module --check < shell-extension/shellExecutor.js
      - name: Shell model tests
        run: node --test shell-extension/homeGridModel.test.mjs shell-extension/workspaceStateModel.test.mjs shell-extension/shellActionModel.test.mjs
      - name: JSON manifests
        shell: bash
        run: |
          python3 -m json.tool shell-extension/metadata.json >/dev/null
          python3 -m json.tool providers/browser/webextension/manifest.json >/dev/null
          python3 -m json.tool providers/vscode/package.json >/dev/null
          python3 -m json.tool examples/hierarchy.json >/dev/null
          python3 -m json.tool examples/workspaces.json >/dev/null
      - name: Build daemon
        run: go build ./cmd/hwsd
      - name: Demo smoke test
        run: go run ./cmd/hwsctl
